{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Головна</a> |
        <a href="{% url 'all_articles' %}">Статті</a> |
        <a href="{% url 'categories_list' %}">Категорії</a> |
        {% if user.is_authenticated %}
            Привіт, {{ user.username }}!
            <a href="{% url 'logout' %}">Вийти</a>
        {% else %}
            <a href="{% url 'login' %}">Увійти</a> |
            <a href="{% url 'register' %}">Зареєструватися</a>
        {% endif %}
    </nav>

    <h2>Реєстрація</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зареєструватися</button>
    </form>
    <p>Вже є аккаунт? <a href="{% url 'login' %}">Увійти</a></p>
</body>
</html>
