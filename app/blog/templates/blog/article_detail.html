<h1>{{ article.title }}</h1>
<p>Категорія: {{ article.category.title }}</p>
<p>Дата: {{ article.publication_date }}</p>
<p>Автор: {{ article.author }}</p>
<img src="{{ article.image }}" alt="{{ article.title }}">
<p>{{ article.text }}</p>

<p>Теги:
{% for t in article.tag.all %}
    {{ t.title }}
{% endfor %}
</p>
