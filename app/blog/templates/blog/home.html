<h2>Останні статті</h2>
<ul>
    {% for article in latest_articles %}
        <li>
            <a href="{% url 'article_detail' article.id %}">{{ article.title }}</a>
            - {{ article.publication_date }}
        </li>
    {% empty %}
        <li>Немає опублікованих статей.</li>
    {% endfor %}
</ul>
